version: "3.8"

services:
  bot:
    build: .
    container_name: familybot
    env_file:
      - .env
    restart: unless-stopped
    command: ["python", "bot.py"]
    volumes:
      - ./data:/app/data

  redirect:
    build: .
    container_name: familybot-redirect
    env_file:
      - .env
    restart: unless-stopped
    command: ["python", "redirect_server.py"]
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
